name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the tag matches src/romlm.py
        run: python .github/scripts/check_version.py

  build:
    needs: [test, check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/romlm-venv
          /tmp/romlm-venv/bin/pip install dist/*.whl
          /tmp/romlm-venv/bin/romlm -v

      - name: Check the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WHEEL_VERSION=$(/tmp/romlm-venv/bin/pip show romlm | sed -n 's/^Version: //p')
          CLI_VERSION=$(/tmp/romlm-venv/bin/romlm -v | sed 's/.* v//')
          echo "tag=$TAG_VERSION wheel=$WHEEL_VERSION cli=$CLI_VERSION"
          test "$TAG_VERSION" = "$WHEEL_VERSION" && test "$TAG_VERSION" = "$CLI_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  windows-exe:
    needs: [test, check-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip tqdm colorama nuitka

      - name: Build standalone exe
        run: >
          python -m nuitka --onefile --assume-yes-for-downloads
          --output-filename=romlm.exe --output-dir=dist src/romlm.py

      - name: Smoke test the exe
        shell: bash
        run: |
          out=$(dist/romlm.exe -v)
          echo "$out"
          test "$out" = "ROMs Library Manager v${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/romlm.exe

  publish-pypi:
    needs: [build, windows-exe] # don't publish if the (flakiest) exe build failed
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true # makes re-running a partly failed release safe

  github-release:
    needs: [publish-pypi, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags -- needed to diff against the previous release tag

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist/

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}${GITHUB_REF_NAME}"

          python3 .github/scripts/categorize_changelog.py "$RANGE" > changelog_section.md

          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > auto_notes.md

          {
            cat auto_notes.md
            echo ""
            echo ""
            cat changelog_section.md
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md

  bump-homebrew-formula:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: ManeFunction/homebrew-tap
          formula: romlm
          no_fork: "true"
