[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romlm"
dynamic = ["version"]
description = "A ROM library management tool."
authors = [
    { name = "Ilia Petrov-Komotskii", email = "ilia@inkedkettle.art" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ROM", "retro", "retro-game", "emulation", "management", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "tqdm==4.67.1",
    "colorama==0.4.6"
]

[project.urls]
Repository = "https://github.com/ManeFunction/romlm"

[project.scripts]
romlm = "romlm:mane"

[tool.setuptools.dynamic]
version = { attr = "romlm.version" }

[tool.setuptools]
py-modules = ["romlm", "tags", "duplicates"]

[tool.setuptools.package-dir]
"" = "src"